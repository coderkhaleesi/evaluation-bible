# Installed by software-factories (install.sh). Pinned to factory ref b3a9c5a.
# The full tier: every lane with its keyed commands, under the nightly environment.
# Only this workflow references that environment. A pull request never does.
name: Nightly
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: nightly-${{ github.ref }}
  cancel-in-progress: true
jobs:
  changes:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      selection: ${{ steps.classify.outputs.selection }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: classify
        uses: coderkhaleesi/software-factories/actions/classify@b3a9c5a01ec2414867cad51a33cc4b88aed34681 # software-factories b3a9c5a
  static:
    needs: changes
    if: ${{ fromJSON(needs.changes.outputs.selection).lanes.static }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: nightly
    env:
      EVAL_BIBLE_AGENT_MODEL: ${{ secrets.EVAL_BIBLE_AGENT_MODEL }}
      EVAL_BIBLE_JUDGE_MODEL: ${{ secrets.EVAL_BIBLE_JUDGE_MODEL }}
      GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/factory-setup
      - uses: coderkhaleesi/software-factories/actions/lane@b3a9c5a01ec2414867cad51a33cc4b88aed34681 # software-factories b3a9c5a
        with:
          lane: static
          selection: ${{ needs.changes.outputs.selection }}
  unit:
    needs: changes
    if: ${{ fromJSON(needs.changes.outputs.selection).lanes.unit }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: nightly
    env:
      EVAL_BIBLE_AGENT_MODEL: ${{ secrets.EVAL_BIBLE_AGENT_MODEL }}
      EVAL_BIBLE_JUDGE_MODEL: ${{ secrets.EVAL_BIBLE_JUDGE_MODEL }}
      GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/factory-setup
      - uses: coderkhaleesi/software-factories/actions/lane@b3a9c5a01ec2414867cad51a33cc4b88aed34681 # software-factories b3a9c5a
        with:
          lane: unit
          selection: ${{ needs.changes.outputs.selection }}
  integration:
    needs: changes
    if: ${{ fromJSON(needs.changes.outputs.selection).lanes.integration }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment: nightly
    env:
      EVAL_BIBLE_AGENT_MODEL: ${{ secrets.EVAL_BIBLE_AGENT_MODEL }}
      EVAL_BIBLE_JUDGE_MODEL: ${{ secrets.EVAL_BIBLE_JUDGE_MODEL }}
      GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/factory-setup
      - uses: coderkhaleesi/software-factories/actions/lane@b3a9c5a01ec2414867cad51a33cc4b88aed34681 # software-factories b3a9c5a
        with:
          lane: integration
          selection: ${{ needs.changes.outputs.selection }}
  acceptance:
    needs: changes
    if: ${{ fromJSON(needs.changes.outputs.selection).lanes.acceptance }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment: nightly
    env:
      EVAL_BIBLE_AGENT_MODEL: ${{ secrets.EVAL_BIBLE_AGENT_MODEL }}
      EVAL_BIBLE_JUDGE_MODEL: ${{ secrets.EVAL_BIBLE_JUDGE_MODEL }}
      GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/factory-setup
      - uses: coderkhaleesi/software-factories/actions/lane@b3a9c5a01ec2414867cad51a33cc4b88aed34681 # software-factories b3a9c5a
        with:
          lane: acceptance
          selection: ${{ needs.changes.outputs.selection }}
  artifact:
    needs: changes
    if: ${{ fromJSON(needs.changes.outputs.selection).lanes.artifact }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: nightly
    env:
      EVAL_BIBLE_AGENT_MODEL: ${{ secrets.EVAL_BIBLE_AGENT_MODEL }}
      EVAL_BIBLE_JUDGE_MODEL: ${{ secrets.EVAL_BIBLE_JUDGE_MODEL }}
      GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/factory-setup
      - uses: coderkhaleesi/software-factories/actions/artifact@b3a9c5a01ec2414867cad51a33cc4b88aed34681 # software-factories b3a9c5a
        with:
          token: ${{ github.token }}
      - uses: coderkhaleesi/software-factories/actions/lane@b3a9c5a01ec2414867cad51a33cc4b88aed34681 # software-factories b3a9c5a
        with:
          lane: artifact
          selection: ${{ needs.changes.outputs.selection }}
  required:
    needs: [changes, static, unit, integration, acceptance, artifact]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: coderkhaleesi/software-factories/actions/required@b3a9c5a01ec2414867cad51a33cc4b88aed34681 # software-factories b3a9c5a
        with:
          needs: ${{ toJSON(needs) }}
