# Installed by software-factories (install.sh). Pinned to factory ref cf52323.
# Nightly mutation sweep. Runs factory.json's mutation command, keeps the report as an artifact,
# posts the score as a neutral check-run and on the "Factory health" issue, and files one
# factory:suggested issue when the score is below the threshold. Nothing here blocks a merge.
name: Mutation sweep
on:
  schedule:
    - cron: "47 3 * * *"
  workflow_dispatch:
permissions:
  contents: read
  checks: write
  issues: write
concurrency:
  group: mutation-${{ github.ref }}
  cancel-in-progress: true
jobs:
  sweep:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/factory-setup
      - uses: coderkhaleesi/software-factories/actions/mutation@cf523235f79facbd8dd2d9c74914a7966fbd12ce # software-factories cf52323
        with:
          token: ${{ github.token }}
      - if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mutation-report-${{ github.run_id }}
          path: reports/mutation/
          if-no-files-found: error
