[project]
name = "evaluation-bible"
version = "0.0.0"
description = "Agent-evaluation best practices for enterprises, packaged as agent skills with runnable demos on Google ADK"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = []

[dependency-groups]
dev = ["pytest>=8.3", "ruff>=0.9", "mypy>=1.14"]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/evaluation_bible"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
strict = true
files = ["src", "tools"]
